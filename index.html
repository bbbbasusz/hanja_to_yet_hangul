<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자-한글 변환기</title>
    <style>
        /* Google Fonts에서 고운바탕체(Gowun Batang) 가져오기 */
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

        /* 공통 변수 설정 - 한국 전통 색감 */
        :root {
            --primary-color: #1a365d; /* 짙은 남색 (전통 관복/먹색 계열) */
            --primary-light-color: #2c5282; /* 밝은 남색 */
            --accent-color: #c53030; /* 전통 주홍/단청 빨강 */
            --accent-soft: #e53e3e;
            --background-color: #f7f3e9; /* 한지 느낌의 따뜻한 베이지 */
            --card-background-color: #fffdf7;
            --text-color: #2d3748;
            --border-color: #d4c9b0;
            --border-radius: 8px;
            --shadow: 0 4px 20px rgba(26, 54, 93, 0.08);
        }

        /* 전체 페이지 스타일 */
        body {
            font-family: 'Gowun Batang', serif;
            background-color: var(--background-color);
            /* 은은한 한지 텍스처 느낌 */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(197, 48, 48, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(26, 54, 93, 0.04) 0%, transparent 40%),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(212, 201, 176, 0.15) 2px,
                    rgba(212, 201, 176, 0.15) 3px
                );
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 컨테이너 스타일 */
        .converter-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-background-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 36px 40px 32px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* 상단 장식선 (단청 느낌) */
        .converter-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, 
                var(--accent-color) 0%, 
                var(--primary-color) 35%, 
                #d69e2e 50%, 
                var(--primary-color) 65%, 
                var(--accent-color) 100%);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        /* 제목 스타일 */
        h1 {
            color: var(--primary-color);
            margin: 12px 0 28px;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: 0.05em;
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            display: block;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            margin: 8px auto 0;
        }

        /* 입력 영역 헤더 (지우기 버튼) */
        .input-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        /* 출력 영역 헤더 (복사 버튼) */
        .output-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        /* 공통 버튼 스타일 */
        .action-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 700;
            font-family: 'Gowun Batang', serif;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.1s, box-shadow 0.25s;
            box-shadow: 0 2px 8px rgba(26, 54, 93, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }

        .action-btn:hover {
            background-color: var(--primary-light-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.3);
        }

        .action-btn:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(26, 54, 93, 0.2);
        }

        .action-btn.clear-btn {
            background-color: #718096;
        }

        .action-btn.clear-btn:hover {
            background-color: #4a5568;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* 입력 그룹 스타일 */
        .input-group {
            margin-bottom: 0;
        }

        /* 텍스트 영역 스타일 */
        textarea {
            width: 100%;
            height: 160px;
            padding: 18px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1.25em;
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: 'Gowun Batang', serif;
            background-color: #fff;
            color: var(--text-color);
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.12);
        }

        textarea::placeholder {
            color: #a0aec0;
        }

        /* 출력 상자 스타일 - 높이 고정 */
        .output-box {
            position: relative;
            background-color: #f8f5ed;
            border: 1.5px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 18px;
            height: 160px; /* 고정 높이 */
            overflow-y: auto;
            text-align: left;
            word-wrap: break-word;
            font-size: 1.25em;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #2d3748;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .output-box:empty::before,
        .output-box.placeholder {
            color: #a0aec0;
        }

        /* 상태 메시지 스타일 */
        .status-message {
            margin-top: 14px;
            font-size: 0.95em;
            color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.4s;
            font-weight: 700;
            min-height: 1.2em;
        }

        .status-message.show {
            opacity: 1;
        }

        /* 하단 작은 장식 */
        .footer-ornament {
            margin-top: 18px;
            font-size: 0.85em;
            color: #a0aec0;
            letter-spacing: 0.15em;
        }
    </style>
</head>

            // 애국가에 나오는 한자 단어 목록으로 변경했습니다.
            const hanjaWords = ['東海水', '白頭山', '南山', '一片丹心', '愛國', '忠誠'];

            // 한자를 한글로 변환하는 함수
            function convertHanjaToHangul(text) {
                // 입력된 텍스트의 각 문자를 반복하며 변환합니다.
                let result = '';
                for (const char of text) {
                    // hanjaMap에 해당 한자가 있으면 한글로 변환하고, 없으면 원래 문자를 그대로 사용합니다.
                    result += hanjaMap[char] || char;
                }
                return result;
            }
            
            // 페이지 로드 시, 무작위 한자 단어를 입력창에 표시
            function setInitialHanja() {
                // 한자 단어 목록에서 무작위로 하나 선택
                const randomIndex = Math.floor(Math.random() * hanjaWords.length);
                const randomHanjaWord = hanjaWords[randomIndex];
                
                hanjaInput.value = randomHanjaWord;
                hangulOutput.textContent = convertHanjaToHangul(randomHanjaWord);
            }

            // 초기 한자 설정
            setInitialHanja();

            // 지우기 버튼 클릭 이벤트
            clearButton.addEventListener('click', () => {
                hanjaInput.value = '';
                hangulOutput.textContent = '변환된 한글이 여기에 나타납니다.';
                hanjaInput.focus();
            });

            // 입력창에 내용이 바뀔 때마다 변환 실행
            hanjaInput.addEventListener('input', () => {
                const inputText = hanjaInput.value;
                const convertedText = convertHanjaToHangul(inputText);

                // 입력 내용이 비어있으면 초기 메시지를 표시
                hangulOutput.textContent = convertedText.trim() === '' ? '변환된 한글이 여기에 나타납니다.' : convertedText;
            });

            // '복사' 버튼 클릭 이벤트
            copyButton.addEventListener('click', () => {
                const textToCopy = hangulOutput.textContent;
                
                try {
                    // 임시 텍스트 영역을 만들어 복사할 텍스트를 담습니다.
                    const tempTextarea = document.createElement('textarea');
                    tempTextarea.value = textToCopy;
                    document.body.appendChild(tempTextarea);

                    // 텍스트를 선택하고 복사 명령을 실행합니다.
                    tempTextarea.select();
                    document.execCommand('copy');
                    
                    // 임시 텍스트 영역을 제거합니다.
                    document.body.removeChild(tempTextarea);
                    
                    // 복사 성공 메시지 표시
                    statusMessage.classList.add('show');
                    setTimeout(() => {
                        statusMessage.classList.remove('show');
                    }, 2000); // 2초 후 메시지 숨김

                } catch (err) {
                    // 복사 실패 시 콘솔에 에러 출력
                    console.error('클립보드 복사 실패:', err);
                }
            });
        });
